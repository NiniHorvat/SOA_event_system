name: Docker Image CI

on:
  push:
    branches:
      - main  # ali ime tvoje glavne veje
  pull_request:
    branches:
      - main  # ali ime tvoje glavne veje

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/event-service-prava:latest .
        docker push ${{ secrets.DOCKER_USERNAME }}/event-service-prava:latest
